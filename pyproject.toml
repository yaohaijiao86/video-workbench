[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-workbench"
version = "0.2.10"
description = "Local video editing and illustrated notes orchestrator with user-configured external tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Video Workbench contributors"}]
dependencies = []

[project.optional-dependencies]
bilibili = ["yt-dlp", "qrcode"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
video-workbench = "video_workbench.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_workbench = ["static/*", "*.json"]
